name: pivo-mehanik
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pivomechanik}
      POSTGRES_USER: ${POSTGRES_USER:-pivomechanik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    # Host port 80 is commonly owned by the server-wide Nginx/Cloudflare proxy.
    # Expose the application gateway on 8081 and proxy a domain to it there.
    ports: ["8081:80"]
    depends_on: [frontend, backend]
    volumes: [./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
